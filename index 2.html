<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>日本史 Knowledge Map</title>
<style>
:root{--bg:#07111f;--panel:#101c2e;--muted:#91a1b8}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}#app{position:fixed;inset:0;touch-action:none}svg{width:100%;height:100%}header{position:fixed;z-index:5;top:calc(9px + env(safe-area-inset-top));left:9px;right:9px;display:flex;gap:7px}.panel{background:#101c2ef2;border:1px solid #2a3b55;border-radius:14px;box-shadow:0 8px 30px #0006}#brand{padding:9px 11px;flex:1}#brand b{font-size:14px}#brand small{display:block;color:var(--muted);font-size:9px;margin-top:2px}button,input,select{font:inherit}button{border:0;border-radius:11px;padding:10px 11px;background:#263751;color:#fff;font-weight:700}#search{position:fixed;z-index:6;left:9px;right:9px;top:calc(61px + env(safe-area-inset-top));display:flex;gap:6px}input,select{background:#101c2ef2;color:#fff;border:1px solid #2a3b55;border-radius:11px;padding:10px;outline:0}input{flex:1}#filters{position:fixed;z-index:6;left:9px;right:9px;top:calc(108px + env(safe-area-inset-top));display:flex;gap:5px;overflow:auto}.filter{white-space:nowrap;padding:7px 9px;font-size:10px;border:1px solid #2a3b55;border-radius:999px;background:#17253a}.filter.on{background:#2563eb}#info{position:fixed;z-index:7;left:9px;right:9px;bottom:calc(42px + env(safe-area-inset-bottom));padding:13px;display:none}.meta{color:var(--muted);font-size:11px;margin:3px 0 8px}.chips{display:flex;gap:5px;flex-wrap:wrap;max-height:80px;overflow:auto}.chip{background:#23344d;border-radius:999px;padding:5px 8px;font-size:10px}.edge{stroke:#536b8c;stroke-width:2;opacity:.32}.edge.active{stroke:#fff;stroke-width:4;opacity:1}.edge.dim{opacity:.04}.edgeLabel{fill:#8193ad;font-size:8px;text-anchor:middle}.edgeLabel.dim{opacity:.04}.node{cursor:pointer}.node circle{stroke:#fff;stroke-opacity:.3;stroke-width:2}.node text{fill:#fff;text-anchor:middle;font-weight:700;pointer-events:none}.node .meta{fill:#a7b6c9;font-size:8px;font-weight:500}.node.dim{opacity:.08}.node.active circle{stroke:#fff;stroke-width:4;filter:drop-shadow(0 0 8px #fff8)}.node.related circle{filter:drop-shadow(0 0 5px #fff6)}#hint{position:fixed;z-index:5;bottom:calc(8px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:#9fb0c7;font-size:10px;white-space:nowrap}
</style></head><body>
<div id="app"><svg id="svg" viewBox="0 0 1400 900"></svg></div>
<header><div id="brand" class="panel"><b>日本史 Knowledge Map</b><small>飛鳥〜奈良｜受験用・知識グラフ</small></div><button id="reset">全体</button></header>
<div id="search"><input id="q" placeholder="用語を検索…"><select id="era"><option value="">全時代</option><option>飛鳥</option><option>7世紀</option><option>8世紀</option><option>奈良</option></select></div>
<div id="filters"></div><div id="info" class="panel"></div><div id="hint">タップ：関連事項｜ドラッグ：移動｜2本指：拡大縮小</div>
<script>
const DATA={"大化の改新": {"type": "事件", "era": "645", "desc": "豪族中心の政治から律令国家形成へ向かう大きな転換。", "links": ["乙巳の変", "中大兄皇子", "公地公民", "改新の詔"]}, "乙巳の変": {"type": "事件", "era": "645", "desc": "中大兄皇子・中臣鎌足らが蘇我入鹿を倒した政変。", "links": ["大化の改新", "中大兄皇子", "中臣鎌足", "蘇我入鹿"]}, "中大兄皇子": {"type": "人物", "era": "7世紀", "desc": "乙巳の変を主導し、のちの天智天皇。", "links": ["乙巳の変", "中臣鎌足", "白村江の戦い", "天智天皇", "大化の改新"]}, "中臣鎌足": {"type": "人物", "era": "7世紀", "desc": "中大兄皇子と協力。藤原氏の祖。", "links": ["乙巳の変", "中大兄皇子", "藤原氏", "藤原不比等"]}, "公地公民": {"type": "制度", "era": "7世紀", "desc": "土地・人民を国家の公的支配下に置く理念。", "links": ["大化の改新", "改新の詔", "班田収授法", "律令国家"]}, "白村江の戦い": {"type": "事件", "era": "663", "desc": "百済復興を支援した倭軍が唐・新羅連合軍に敗北。", "links": ["中大兄皇子", "唐・新羅", "防人", "天智天皇"]}, "唐・新羅": {"type": "外交", "era": "7世紀", "desc": "東アジア情勢を理解する鍵となる勢力。", "links": ["白村江の戦い", "百済", "高句麗", "唐"]}, "天智天皇": {"type": "人物", "era": "668〜671", "desc": "中大兄皇子。近江大津宮を中心に政治を行う。", "links": ["中大兄皇子", "近江令", "白村江の戦い", "壬申の乱"]}, "壬申の乱": {"type": "事件", "era": "672", "desc": "皇位継承をめぐる内乱。大海人皇子が勝利。", "links": ["天智天皇", "天武天皇", "持統天皇"]}, "天武天皇": {"type": "人物", "era": "673〜686", "desc": "壬申の乱に勝利。天皇中心の国家形成を推進。", "links": ["壬申の乱", "飛鳥浄御原令", "持統天皇", "律令国家"]}, "飛鳥浄御原令": {"type": "制度", "era": "689", "desc": "天武・持統朝の律令国家形成に関わる法令。", "links": ["天武天皇", "持統天皇", "律令国家"]}, "持統天皇": {"type": "人物", "era": "690〜697", "desc": "藤原京を完成させ、律令国家形成を継承。", "links": ["天武天皇", "飛鳥浄御原令", "藤原京", "文武天皇", "壬申の乱"]}, "藤原京": {"type": "文化・都市", "era": "694", "desc": "本格的な都城として整備された都。", "links": ["持統天皇", "文武天皇", "平城京"]}, "律令国家": {"type": "制度", "era": "7〜8世紀", "desc": "律令を基盤に天皇を中心として統治する国家。", "links": ["公地公民", "班田収授法", "大宝律令", "天武天皇", "飛鳥浄御原令", "養老律令", "奈良時代"]}, "大宝律令": {"type": "制度", "era": "701", "desc": "律・令を体系的に整備。律令国家の制度を完成へ導く。", "links": ["律令国家", "藤原不比等", "文武天皇", "養老律令"]}, "藤原不比等": {"type": "人物", "era": "7〜8世紀", "desc": "大宝律令・養老律令の編纂に関わった有力者。", "links": ["中臣鎌足", "藤原氏", "大宝律令", "養老律令", "光明皇后", "文武天皇"]}, "藤原氏": {"type": "人物", "era": "飛鳥〜奈良", "desc": "中臣鎌足を祖とし、奈良時代に勢力を拡大。", "links": ["中臣鎌足", "藤原不比等", "光明皇后"]}, "班田収授法": {"type": "制度", "era": "律令制", "desc": "戸籍に基づき口分田を班給する土地制度。", "links": ["公地公民", "律令国家", "墾田永年私財法", "三世一身法", "荘園"]}, "三世一身法": {"type": "制度", "era": "723", "desc": "開墾した土地の一定期間の私有を認めた法。", "links": ["班田収授法", "墾田永年私財法"]}, "墾田永年私財法": {"type": "制度", "era": "743", "desc": "開墾地の永久私有を認め、荘園発達につながる。", "links": ["班田収授法", "三世一身法", "聖武天皇", "荘園"]}, "聖武天皇": {"type": "人物", "era": "724〜749", "desc": "国分寺・東大寺大仏などを通じ仏教による国家鎮護を進めた。", "links": ["国分寺", "東大寺", "大仏", "墾田永年私財法", "天平文化", "光明皇后", "奈良時代", "平城京"]}, "国分寺": {"type": "制度・宗教", "era": "741", "desc": "全国に国分寺・国分尼寺を建立させた政策。", "links": ["聖武天皇", "東大寺", "天平文化"]}, "東大寺": {"type": "文化・宗教", "era": "奈良", "desc": "聖武天皇による大仏造立の中心寺院。", "links": ["聖武天皇", "大仏", "天平文化", "国分寺", "正倉院"]}, "大仏": {"type": "文化・宗教", "era": "752", "desc": "東大寺盧舎那仏。国家鎮護の象徴。", "links": ["東大寺", "聖武天皇", "天平文化"]}, "天平文化": {"type": "文化・思想", "era": "8世紀", "desc": "国際色豊かな奈良時代の文化。仏教・唐文化の影響が強い。", "links": ["聖武天皇", "東大寺", "正倉院", "唐", "国分寺", "大仏", "遣唐使", "奈良時代"]}, "正倉院": {"type": "文化", "era": "奈良", "desc": "東大寺に伝わる宝物を収蔵。国際交流を示す。", "links": ["天平文化", "東大寺", "唐"]}, "光明皇后": {"type": "人物", "era": "8世紀", "desc": "藤原不比等の娘。聖武天皇の皇后。", "links": ["藤原不比等", "藤原氏", "聖武天皇"]}, "養老律令": {"type": "制度", "era": "718 / 757", "desc": "大宝律令を修訂した律令。", "links": ["大宝律令", "藤原不比等", "律令国家"]}, "文武天皇": {"type": "人物", "era": "697〜707", "desc": "大宝律令が制定された時代の天皇。", "links": ["大宝律令", "持統天皇", "藤原不比等", "藤原京"]}, "聖徳太子": {"type": "人物", "era": "推古朝", "desc": "厩戸王。冠位十二階・十七条憲法などで知られる。", "links": ["推古天皇", "冠位十二階", "十七条憲法", "遣隋使"]}, "推古天皇": {"type": "人物", "era": "592〜628", "desc": "日本初の女性天皇。聖徳太子らと政治を進めた。", "links": ["聖徳太子", "蘇我氏", "遣隋使", "冠位十二階", "十七条憲法"]}, "冠位十二階": {"type": "制度", "era": "603", "desc": "氏姓ではなく才能や功績を基準にした冠位制度。", "links": ["聖徳太子", "推古天皇"]}, "十七条憲法": {"type": "制度", "era": "604", "desc": "役人の心構えを示した政治理念。", "links": ["聖徳太子", "推古天皇"]}, "遣隋使": {"type": "外交", "era": "7世紀", "desc": "隋へ派遣された使節。東アジアとの交流を進めた。", "links": ["聖徳太子", "推古天皇", "隋", "小野妹子"]}, "小野妹子": {"type": "人物", "era": "7世紀", "desc": "遣隋使として隋へ派遣された人物。", "links": ["遣隋使", "隋"]}, "遣唐使": {"type": "外交", "era": "7〜9世紀", "desc": "唐へ派遣された使節。制度・文化を日本へ伝えた。", "links": ["唐", "天平文化"]}, "唐": {"type": "外交", "era": "7〜8世紀", "desc": "遣唐使などを通じ日本に大きな影響を与えた中国王朝。", "links": ["遣唐使", "天平文化", "正倉院", "唐・新羅"]}, "奈良時代": {"type": "時代", "era": "710〜794", "desc": "平城京を中心とした時代。律令国家と天平文化が発展。", "links": ["平城京", "律令国家", "聖武天皇", "天平文化"]}, "平城京": {"type": "文化・都市", "era": "710", "desc": "奈良時代の政治・文化の中心。", "links": ["奈良時代", "藤原京", "聖武天皇"]}, "荘園": {"type": "制度", "era": "奈良〜", "desc": "私有地の発達。律令制の変化を理解する重要語。", "links": ["墾田永年私財法", "班田収授法"]}}, C={人物:"#60a5fa",事件:"#f59e0b",制度:"#34d399","制度・宗教":"#34d399",外交:"#c084fc","文化・思想":"#fb7185",文化:"#fb7185","文化・都市":"#fb7185","文化・宗教":"#fb7185",時代:"#a78bfa"};
const names=Object.keys(DATA),pos={};names.forEach((n,i)=>{pos[n]=[120+(i%7)*195,210+Math.floor(i/7)*145]});
const svg=document.getElementById("svg"),filters=document.getElementById("filters");let selected=null,activeType="",view={x:0,y:0,s:1},drag=null,pinch=null;
["人物","事件","制度","外交","文化","文化・思想","文化・都市","時代"].forEach(t=>{let b=document.createElement("button");b.className="filter";b.textContent=t;b.onclick=()=>{activeType=activeType===t?"":t;b.classList.toggle("on",!!activeType);render()};filters.append(b)});
function S(t,a={},txt=""){let e=document.createElementNS("http://www.w3.org/2000/svg",t);for(let k in a)e.setAttribute(k,a[k]);if(txt)e.textContent=txt;return e}
function render(){svg.innerHTML="";let root=S("g",{transform:`translate(${view.x} ${view.y}) scale(${view.s})`});svg.append(root);let eg=S("g");root.append(eg);let rel=selected?new Set([selected,...DATA[selected].links]):null;
names.forEach(a=>DATA[a].links.forEach(b=>{if(a>=b||!DATA[b])return;let [x1,y1]=pos[a],[x2,y2]=pos[b],act=selected&&(a===selected||b===selected);eg.append(S("line",{x1,y1,x2,y2,class:"edge "+(act?"active":"")+(selected&&!act?" dim":"")}));eg.append(S("text",{x:(x1+x2)/2,y:(y1+y2)/2-4,class:"edgeLabel "+(selected&&!act?"dim":"")},a+" ↔ "+b))}));
names.forEach(n=>{let d=DATA[n],[x,y]=pos[n],match=(!activeType||d.type===activeType)&&(!document.getElementById("era").value||d.era.includes(document.getElementById("era").value))&&(!document.getElementById("q").value||n.includes(document.getElementById("q").value));let dim=selected&&!rel.has(n)||!match;let g=S("g",{class:"node "+(dim?"dim ":"")+(selected===n?"active ":"")+(selected&&rel.has(n)&&selected!==n?"related ":""),transform:`translate(${x} ${y})`});g.append(S("circle",{r:43,fill:C[d.type]||"#64748b",opacity:.18}),S("circle",{r:35,fill:C[d.type]||"#64748b"}),S("text",{y:4,"font-size":n.length>8?10:13},n),S("text",{y:51,class:"meta"},d.type+" · "+d.era));g.addEventListener("pointerdown",e=>{e.stopPropagation();select(n)});root.append(g)})}
function select(n){selected=n;let d=DATA[n],box=document.getElementById("info");box.style.display="block";box.innerHTML=`<b style="font-size:19px">${n}</b><div class="meta">${d.type} · ${d.era}</div><div>${d.desc}</div><div class="meta">直接につながる事項</div><div class="chips">${d.links.map(x=>`<span class="chip">${x}</span>`).join("")}</div>`;render()}
function reset(){selected=null;document.getElementById("info").style.display="none";view={x:0,y:0,s:1};render()}
document.getElementById("reset").onclick=reset;document.getElementById("q").oninput=render;document.getElementById("era").onchange=render;
document.getElementById("app").addEventListener("pointerdown",e=>{if(e.target.closest(".node"))return;drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y}});
document.getElementById("app").addEventListener("pointermove",e=>{if(!drag||pinch)return;view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y;render()});document.getElementById("app").addEventListener("pointerup",()=>drag=null);
document.getElementById("app").addEventListener("wheel",e=>{view.s=Math.max(.5,Math.min(2.5,view.s*(e.deltaY<0?1.1:.9)));render()});
document.getElementById("app").addEventListener("touchstart",e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});
document.getElementById("app").addEventListener("touchmove",e=>{if(e.touches.length!==2||!pinch)return;let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);view.s=Math.max(.5,Math.min(2.5,view.s*d/pinch));pinch=d;render()},{passive:true});document.getElementById("app").addEventListener("touchend",()=>pinch=null,{passive:true});render();
</script></body></html>
