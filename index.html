document.getElementById("app").addEventListener("pointerdown",e=>{if(e.target.closest(".node"))return;drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y}});
document.getElementById("app").addEventListener("pointermove",e=>{if(!drag||pinch)return;view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y;render()});document.getElementById("app").addEventListener("pointerup",()=>drag=null);
document.getElementById("app").addEventListener("wheel",e=>{view.s=Math.max(.5,Math.min(2.5,view.s*(e.deltaY<0?1.1:.9)));render()});
document.getElementById("app").addEventListener("touchstart",e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});
document.getElementById("app").addEventListener("touchmove",e=>{if(e.touches.length!==2||!pinch)return;let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);view.s=Math.max(.5,Math.min(2.5,view.s*d/pinch));pinch=d;render()},{passive:true});document.getElementById("app").addEventListener("touchend",()=>pinch=null,{passive:true});function animate(t){last=t;render();requestAnimationFrame(animate)}requestAnimationFrame(animate);
</script></body></html>
