 <style>

<body>

];

};
const LINEAGES={"showa-postwar":{id:"showa-postwar",name:"戦後改革の系譜",terms:["GHQ","戦後改革","日本国憲法"]}};
const periodName=Object.fromEntries(PERIODS.map(p=>[p.id,p.name]));
const names=Object.keys(DATA), C={人物:"#2563eb",事件:"#dc2626",制度:"#059669",外交:"#7c3aed",文化:"#d97706","文化・思想":"#db2777","文化・都市":"#0891b2","文化・宗教":"#65a30d",時代:"#64748b"};
let context={kind:"period",id:"asuka",terms:[]},selected=null,activeType="",view={x:0,y:0,s:1},drag=null,pinch=null,last=0,homeMode="era";
const svg=document.getElementById("svg"),mapScreen=document.getElementById("mapScreen"),home=document.getElementById("home"),cards=document.getElementById("cards"),filters=document.getElementById("filters"),results=document.getElementById("results"),q=document.getElementById("q");
function periodTerms(id){return names.filter(n=>(DATA[n].periods||[]).includes(id))}
function lineageTerms(id){return LINEAGES[id]?.terms||[]}
function lineagesForTerm(n){return Object.values(LINEAGES).filter(l=>l.terms.includes(n))}
function safeLinks(n,scope=names){return (DATA[n]?.links||[]).filter(x=>DATA[x]&&scope.includes(x))}
function renderHome(){home.classList.remove("hide");mapScreen.classList.add("hide");cards.innerHTML="";if(homeMode==="era"){PERIODS.forEach(p=>{let b=document.createElement("button");b.className="card";b.innerHTML=`<b>${p.name}</b><small>${p.subtitle}</small><span class="count">${periodTerms(p.id).length}語</span>`;b.onclick=()=>openPeriod(p.id);cards.append(b)})}else{Object.values(LINEAGES).forEach(l=>{let b=document.createElement("button");b.className="card";b.innerHTML=`<b>${l.name}</b><small>時代横断のつながり</small><span class="count">${l.terms.length}語</span>`;b.onclick=()=>openLineage(l.id);cards.append(b)})}}
function enterMap(){home.classList.add("hide");mapScreen.classList.remove("hide");q.value="";results.style.display="none";activeType="";filters.querySelectorAll(".filter").forEach(x=>x.classList.remove("on"));view={x:0,y:0,s:1};render()}
function openPeriod(id,focus){let p=PERIODS.find(x=>x.id===id);context={kind:"period",id,terms:periodTerms(id)};document.getElementById("title").textContent=`${p.name}時代｜${p.subtitle}`;document.getElementById("subtitle").textContent="時代ごとのKnowledge Map";enterMap();if(focus&&DATA[focus])select(focus,true)}
function openLineage(id,focus){let l=LINEAGES[id];context={kind:"lineage",id,terms:lineageTerms(id)};document.getElementById("title").textContent=l.name;document.getElementById("subtitle").textContent="時代横断の系譜｜同一制度ではなく役割・機能の流れ";enterMap();if(focus&&DATA[focus])select(focus,true)}
function openTerm(n){let p=(DATA[n].periods||[])[0]||"asuka";openPeriod(p,n)}
function S(t,a={},txt=""){let e=document.createElementNS("http://www.w3.org/2000/svg",t);for(let k in a)e.setAttribute(k,a[k]);if(txt)e.textContent=txt;return e}
function layout(){let terms=context.terms.filter(n=>DATA[n]);pos={};if(context.kind==="lineage"){terms.forEach((n,i)=>{pos[n]=[150+i*180,390+Math.sin(i*.9)*42]})}else{terms.sort((a,b)=>(parseInt(DATA[a].era)||9999)-(parseInt(DATA[b].era)||9999)||a.localeCompare(b,"ja")).forEach((n,i)=>{pos[n]=[130+(i%6)*205,190+Math.floor(i/6)*140]})}}
function centerOn(n){if(!pos[n])layout();let [x,y]=pos[n]||[700,450],vb=svg.viewBox.baseVal;view.s=Math.max(1.15,view.s);view.x=vb.width/2-x*view.s;view.y=vb.height/2-y*view.s}
function drift(n){let i=names.indexOf(n),t=last/1000;return [Math.sin(t*.45+i)*8,Math.cos(t*.37+i*1.3)*6]}
function visibleTerms(){let termset=context.terms.filter(n=>DATA[n]);let val=q.value.trim();if(val){let hits=names.filter(n=>n.includes(val)||DATA[n].desc.includes(val));termset=[...new Set([...termset,...hits])] }return termset.filter(n=>!activeType||DATA[n].type===activeType)}
function render(){layout();svg.innerHTML="";let terms=visibleTerms(),scope=new Set(terms),root=S("g",{transform:`translate(${view.x} ${view.y}) scale(${view.s})`});svg.append(root);let eg=S("g");root.append(eg);let rel=selected?new Set([selected,...safeLinks(selected,terms),...lineagesForTerm(selected).flatMap(l=>l.terms).filter(x=>scope.has(x))]):null;
terms.forEach(a=>safeLinks(a,terms).forEach(b=>{if(a>=b)return;drawEdge(eg,a,b,selected&&(a===selected||b===selected),selected&&!(a===selected||b===selected),false)}));
if(context.kind==="lineage"){let lt=lineageTerms(context.id);for(let i=0;i<lt.length-1;i++)if(scope.has(lt[i])&&scope.has(lt[i+1]))drawEdge(eg,lt[i],lt[i+1],selected&&(lt[i]===selected||lt[i+1]===selected),false,true)}
terms.forEach(n=>{let d=DATA[n],[x,y]=pos[n]||[700,450],dn=drift(n);x+=dn[0];y+=dn[1];let dim=selected&&!rel.has(n);let g=S("g",{class:"node "+(dim?"dim ":"")+(selected===n?"active ":"")+(selected&&rel.has(n)&&selected!==n?"related ":""),transform:`translate(${x} ${y})`});g.append(S("circle",{r:46,fill:C[d.type]||"#64748b",opacity:.18}),S("circle",{r:37,fill:C[d.type]||"#64748b"}),S("text",{y:4,"font-size":n.length>8?10:13},n),S("text",{y:54,class:"metaText"},`${d.type} · ${d.era}`));g.addEventListener("pointerdown",e=>{e.stopPropagation();select(n,true)});root.append(g)})}
function drawEdge(eg,a,b,act,dim,lineage){let [x1,y1]=pos[a]||[0,0],[x2,y2]=pos[b]||[0,0],da=drift(a),db=drift(b);x1+=da[0];y1+=da[1];x2+=db[0];y2+=db[1];eg.append(S("line",{x1,y1,x2,y2,class:"edge "+(lineage?"lineageEdge ":"")+(act?"active ":"")+(dim?"dim":"")}));if(!lineage)eg.append(S("text",{x:(x1+x2)/2,y:(y1+y2)/2-4,class:"edgeLabel "+(dim?"dim":"")},`${a} ↔ ${b}`))}
function chip(label,handler,cls=""){let b=document.createElement("button");b.className="chip "+cls;b.textContent=label;b.onclick=handler;return b}
function select(n,move=false){if(!DATA[n])return;selected=n;if(move)centerOn(n);let d=DATA[n],box=document.getElementById("info"),periods=(d.periods||[]).map(p=>periodName[p]).filter(Boolean),lins=lineagesForTerm(n);box.style.display="block";box.innerHTML=`<b style="font-size:19px">${n}</b><div class="meta">${d.type} · ${d.era}<br>${periods.join("・")}</div><div>${d.desc}</div><div class="meta">直接につながる事項</div><div class="chips" id="direct"></div><div class="meta">時代・時代横断で関連する系譜</div><div class="chips" id="jump"></div>`;let direct=box.querySelector("#direct"),jump=box.querySelector("#jump");safeLinks(n).forEach(x=>direct.append(chip(x,()=>DATA[x]&&(context.terms.includes(x)?select(x,true):openTerm(x)))));periods.forEach((p,i)=>jump.append(chip(p,()=>openPeriod(d.periods[i],n),"lineage")));lins.forEach(l=>{jump.append(chip(`${l.name}の系譜`,()=>openLineage(l.id,n),"lineage"));l.terms.filter(x=>x!==n&&DATA[x]).forEach(x=>jump.append(chip(x,()=>context.terms.includes(x)?select(x,true):openLineage(l.id,x),"lineage"))) });render()}
function reset(){selected=null;document.getElementById("info").style.display="none";view={x:0,y:0,s:1};render()}
function renderResults(){let v=q.value.trim();if(!v){results.style.display="none";render();return}let hits=names.filter(n=>n.includes(v)||DATA[n].desc.includes(v)).slice(0,20);results.innerHTML="";hits.forEach(n=>{let b=document.createElement("button");b.className="result";b.innerHTML=`<span>${n}</span><small>${(DATA[n].periods||[]).map(p=>periodName[p]).join(" → ")}</small>`;b.onclick=()=>{results.style.display="none";if(!context.terms.includes(n)){context.terms=[...new Set([...context.terms,n,...safeLinks(n)])]}select(n,true)};results.append(b)});results.style.display=hits.length?"block":"none";renderResults}
["人物","事件","制度","外交","文化","文化・思想","文化・都市","文化・宗教","時代"].forEach(t=>{let b=document.createElement("button");b.className="filter";b.textContent=t;b.onclick=()=>{activeType=activeType===t?"":t;filters.querySelectorAll(".filter").forEach(x=>x.classList.remove("on"));b.classList.toggle("on",!!activeType);render()};filters.append(b)});
document.getElementById("eraEntry").onclick=()=>{homeMode="era";renderHome()};document.getElementById("lineageEntry").onclick=()=>{homeMode="lineage";renderHome()};document.getElementById("back").onclick=renderHome;document.getElementById("reset").onclick=reset;q.oninput=renderResults;
document.getElementById("app").addEventListener("pointerdown",e=>{if(e.target.closest(".node"))return;drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y}});document.getElementById("app").addEventListener("pointermove",e=>{if(!drag||pinch)return;view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y;render()});document.getElementById("app").addEventListener("pointerup",()=>drag=null);document.getElementById("app").addEventListener("wheel",e=>{e.preventDefault();view.s=Math.max(.45,Math.min(2.8,view.s*(e.deltaY<0?1.1:.9)));render()},{passive:false});document.getElementById("app").addEventListener("touchstart",e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});document.getElementById("app").addEventListener("touchmove",e=>{if(e.touches.length!==2||!pinch)return;let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);view.s=Math.max(.45,Math.min(2.8,view.s*d/pinch));pinch=d;render()},{passive:true});document.getElementById("app").addEventListener("touchend",()=>pinch=null,{passive:true});
function animate(t){last=t;if(!mapScreen.classList.contains("hide"))render();requestAnimationFrame(animate)}renderHome();requestAnimationFrame(animate);
