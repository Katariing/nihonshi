w:hidden;text-overflow:ellipsis}.back{background:#1f3656}#search{position:fixed;z-index:6;left:9px;right:9px;top:calc(62px + env(safe-area-inset-top));display:flex}input{width:100%;background:#101c2ef2;color:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;outline:0}#results{position:fixed;z-index:9;left:9px;right:9px;top:calc(112px + env(safe-area-inset-top));display:none;max-height:34vh;overflow:auto;padding:8px}.result{display:flex;justify-content:space-between;gap:8px;width:100%;margin:4px 0;text-align:left;background:#172843}.result small{color:#aebbd0;font-weight:600}#filters{position:fixed;z-index:6;left:9px;right:9px;top:calc(113px + env(safe-area-inset-top));display:flex;gap:5px;overflow:auto;padding-bottom:4px}.filter{white-space:nowrap;padding:8px 10px;font-size:11px;border:1px solid var(--line);border-radius:999px;background:#17253a}.filter.on{background:var(--blue)}#info{position:fixed;z-index:7;left:9px;right:9px;bottom:calc(42px + env(safe-area-inset-bottom));padding:13px;display:none;max-height:42vh;overflow:auto}.meta{color:var(--muted);font-size:12px;margin:4px 0 9px;line-height:1.4}.reason{margin:8px 0;padding:9px 11px;border-left:3px solid #f59e0b;background:#182943;border-radius:8px;line-height:1.5}.chips{display:flex;gap:6px;flex-wrap:wrap;max-height:110px;overflow:auto}.chip{background:#23344d;border:1px solid #38506f;color:#fff;border-radius:999px;padding:9px 11px;font-size:12px;cursor:pointer}.chip.lineage{background:#3b2b59;border-color:#6d57a8}.edge{stroke:#536b8c;stroke-width:2;opacity:.32}.edge.active{stroke:#fff;stroke-width:4;opacity:1}.edge.dim{opacity:.04}.edge.cause{stroke:#f59e0b;stroke-width:3;opacity:.7}.edge.cause.active{stroke:#ffd166;stroke-width:5;opacity:1}.edgeLabel{fill:#8193ad;font-size:8px;text-anchor:middle}.edgeLabel.cause{fill:#fbbf24;font-weight:800}.edgeLabel.dim{opacity:.04}.node{cursor:pointer}.node circle{stroke:#fff;stroke-opacity:.3;stroke-width:2}.node text{fill:#fff;text-anchor:middle;font-we const DATA={
"縄文時代":{type:"時代",era:"約1.4万年前〜前4世紀",periods:["ancient"],desc:"狩猟・採集・漁労を基盤とし、定住生活が発達した時代。",links:["弥生時代","縄文土器"]},"縄文土器":{type:"文化",era:"縄文",periods:["ancient"],desc:"厚手で文様の豊かな土器。縄文文化を代表する。",links:["縄文時代"]},"弥生時代":{type:"時代",era:"前4世紀頃〜3世紀",periods:["ancient"],desc:"水稲農耕・金属器が広まり、身分差や小国の形成が進んだ時代。",links:["邪馬台国","卑弥呼"]},"邪馬台国":{type:"事件",era:"3世紀",periods:["ancient"],desc:"魏志倭人伝に記される倭の国。卑弥呼が統治した。",links:["弥生時代","卑弥呼"]},"卑弥呼":{type:"人物",era:"3世紀",periods:["ancient"],desc:"邪馬台国の女王。魏に使者を送り親魏倭王の称号を受けた。",links:["邪馬台国"]},
"聖徳太子":{type:"人物",era:"推古朝",periods:["asuka"],desc:"厩戸王。冠位十二階・十七条憲法・遣隋使などで知られる。",links:["推古天皇","冠位十二階","十七条憲法","遣隋使"]},"推古天皇":{type:"人物",era:"592〜628",periods:["asuka"],desc:"日本初の女性天皇。聖徳太子らと政治を進めた。",links:["聖徳太子","蘇我氏","遣隋使"]},"冠位十二階":{type:"制度",era:"603",periods:["asuka"],desc:"氏姓ではなく才能・功績を基準に冠位を与えた制度。",links:["聖徳太子"]},"十七条憲法":{type:"制度",era:"604",periods:["asuka"],desc:"役人の心構えを示した政治理念。",links:["聖徳太子"]},"遣隋使":{type:"外交",era:"7世紀",periods:["asuka"],desc:"隋へ派遣された使節。東アジアとの交流を進めた。",links:["聖徳太子","隋","小野妹子"]},"小野妹子":{type:"人物",era:"7世紀",periods:["asuka"],desc:"遣隋使として隋へ派遣された人物。",links:["遣隋使","隋"]},"隋":{type:"外交",era:"6〜7世紀",periods:["asuka"],desc:"遣隋使の派遣先となった中国王朝。",links:["遣隋使"]},"蘇我氏":{type:"人物",era:"飛鳥",periods:["asuka"],desc:"飛鳥時代の有力豪族。仏教受容や推古朝政治で大きな力を持った。",links:["推古天皇","蘇我入鹿","乙巳の変","仏教伝来"]},"蘇我入鹿":{type:"人物",era:"645",periods:["asuka"],desc:"蘇我氏の有力者。乙巳の変で中大兄皇子らに倒された。",links:["蘇我氏","乙巳の変"]},"仏教伝来":{type:"文化・宗教",era:"6世紀",periods:["asuka"],desc:"百済から仏教が伝わり、古代国家形成と文化に影響した。",links:["蘇我氏","百済","飛鳥文化"]},"飛鳥文化":{type:"文化・思想",era:"飛鳥",periods:["asuka"],desc:"仏教色の強い日本最初の本格的仏教文化。",links:["仏教伝来","法隆寺","聖徳太子"]},"法隆寺":{type:"文化・宗教",era:"飛鳥",periods:["asuka"],desc:"聖徳太子ゆかりの寺院。飛鳥文化を代表する建築。",links:["聖徳太子","飛鳥文化"]},
"乙巳の変":{type:"事件",era:"645",periods:["asuka"],desc:"中大兄皇子・中臣鎌足らが蘇我入鹿を倒した政変。",links:["大化の改新","中大兄皇子","中臣鎌足","蘇我入鹿"],cause:["蘇我氏の専横への反発"]},"大化の改新":{type:"事件",era:"645〜",periods:["asuka"],desc:"乙巳の変を起点に、豪族中心の政治から律令国家へ向かった改革。",links:["乙巳の変","中大兄皇子","公地公民","改新の詔"]},"中大兄皇子":{type:"人物",era:"7世紀",periods:["asuka"],desc:"乙巳の変を主導し、のちの天智天皇。",links:["乙巳の変","中臣鎌足","白村江の戦い","天智天皇"]},"中臣鎌足":{type:"人物",era:"7世紀",periods:["asuka"],desc:"中大兄皇子と協力。藤原氏の祖。",links:["乙巳の変","中大兄皇子","藤原氏","藤原不比等"]},"公地公民":{type:"制度",era:"7世紀",periods:["asuka"],desc:"土地・人民を国家の公的支配下に置く理念。",links:["大化の改新","改新の詔","班田収授法","律令国家"]},"改新の詔":{type:"制度",era:"646",periods:["asuka"],desc:"公地公民や地方行政制度など、律令国家化の方針を示した詔。",links:["大化の改新","公地公民","律令国家"]},"白村江の戦い":{type:"事件",era:"663",periods:["asuka"],desc:"百済復興を支援した倭軍が唐・新羅連合軍に敗北。",links:["中大兄皇子","唐・新羅","防人","天智天皇"],cause:["百済復興支援と唐・新羅への対抗"]},"唐・新羅":{type:"外交",era:"7世紀",periods:["asuka","nara"],desc:"東アジア情勢を理解する鍵となる勢力。",links:["白村江の戦い","百済","高句麗","唐"]},"百済":{type:"外交",era:"古代",periods:["ancient","asuka"],desc:"朝鮮半島南西部の国。仏教伝来や白村江の戦いで重要。",links:["仏教伝来","白村江の戦い","唐・新羅"]},"高句麗":{type:"外交",era:"古代",periods:["ancient","asuka"],desc:"朝鮮半島北部から中国東北部にかけて勢力を持った国。",links:["唐・新羅"]},"天智天皇":{type:"人物",era:"668〜671",periods:["asuka"],desc:"中大兄皇子。近江大津宮を中心に政治を行った。",links:["中大兄皇子","近江令","白村江の戦い","壬申の乱"]},"防人":{type:"制度",era:"7〜8世紀",periods:["asuka","nara"],desc:"北九州防衛にあたった兵士。白村江敗戦後の国防強化と関係。",links:["白村江の戦い","律令国家"]},"壬申の乱":{type:"事件",era:"672",periods:["asuka"],desc:"皇位継承をめぐる内乱。大海人皇子が勝利。",links:["天智天皇","天武天皇","持統天皇"],cause:["天智天皇死後の皇位継承対立"]},"天武天皇":{type:"人物",era:"673〜686",periods:["asuka"],desc:"壬申の乱に勝利。天皇中心の国家形成を推進。",links:["壬申の乱","飛鳥浄御原令","持統天皇","律令国家"]},"飛鳥浄御原令":{type:"制度",era:"689",periods:["asuka"],desc:"天武・持統朝の律令国家形成に関わる法令。",links:["天武天皇","持統天皇","律令国家"]},"持統天皇":{type:"人物",era:"690〜697",periods:["asuka"],desc:"藤原京を完成させ、律令国家形成を継承。",links:["天武天皇","藤原京","文武天皇"]},"藤原京":{type:"文化・都市",era:"694",periods:["asuka"],desc:"本格的な都城として整備された都。",links:["持統天皇","平城京"]},"律令国家":{type:"制度",era:"7〜8世紀",periods:["asuka","nara"],desc:"律令を基盤に天皇を中心として統治する国家。",links:["公地公民","班田収授法","大宝律令","太政官"]},"大宝律令":{type:"制度",era:"701",periods:["asuka","nara"],desc:"律・令を体系的に整備し、律令国家の制度を完成へ導いた。",links:["律令国家","藤原不比等","文武天皇","養老律令"]},"藤原不比等":{type:"人物",era:"7〜8世紀",periods:["asuka","nara"],desc:"大宝律令・養老律令の編纂に関わった有力者。",links:["中臣鎌足","藤原氏","大宝律令","養老律令","光明皇后"]},"藤原氏":{type:"人物",era:"飛鳥〜奈良〜平安",periods:["asuka","nara","heian"],desc:"中臣鎌足を祖とし、奈良から平安にかけて勢力を拡大した氏族。",links:["中臣鎌足","藤原不比等","光明皇后","摂関政治"]},"文武天皇":{type:"人物",era:"697〜707",periods:["asuka","nara"],desc:"大宝律令が制定された時代の天皇。",links:["大宝律令","持統天皇","藤原不比等"]},

const names=Object.keys(DATA),periodName=Object.fromEntries(PERIODS.map(p=>[p.id,p.name]));let homeMode="era",context={kind:"home",id:null,terms:[]},selected=null,activeType="",view={x:0,y:0,s:1},drag=null,pinch=null,last=0,pos={};
