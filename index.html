const eraOf=n=>D[n]?.era||'';const periodsOf=n=>{let y=D[n]?.year||'';if(/縄文|弥生/.test(D[n]?.era||''))return ['ancient'];if(/飛鳥/.test(D[n]?.era||''))return ['asuka'];if(/奈良/.test(D[n]?.era||''))return ['nara'];if(/平安/.test(D[n]?.era||''))return ['heian'];if(/鎌倉/.test(D[n]?.era||''))return ['kamakura'];if(/室町/.test(D[n]?.era||''))return ['muromachi'];if(/安土桃山/.test(D[n]?.era||''))return ['azuchi'];if(/江戸/.test(D[n]?.era||''))return ['edo'];if(/明治/.test(D[n]?.era||''))return ['meiji'];if(/大正/.test(D[n]?.era||''))return ['taisho'];if(/昭和/.test(D[n]?.era||''))return ['showa'];if(/平成/.test(D[n]?.era||''))return ['heisei'];if(/〜1945|193|194/.test(y))return ['showa'];return ['edo']};

const svg=document.getElementById('svg');const NS='http://www.w3.org/2000/svg';
function nodePeriod(n){return periodsOf(n)[0]}
function renderCards(){const c=document.getElementById('cards');c.innerHTML=Object.entries(periods).map(([id,name])=>`<button class="card" data-era="${id}"><b>${name}</b><small>${Object.keys(D).filter(n=>nodePeriod(n)===id).slice(0,4).join('・')}</small><div class="count">${Object.keys(D).filter(n=>nodePeriod(n)===id).length}語</div></button>`).join('');c.querySelectorAll('.card').forEach(b=>b.onclick=()=>openMap(b.dataset.era))}
function openMap(f='all'){document.getElementById('home').classList.add('hide');document.getElementById('mapScreen').classList.remove('hide');filter=f;document.getElementById('filters').innerHTML='<button class="filter '+(f==='all'?'on':'')+'" data-f="all">全時代</button>'+Object.entries(periods).map(([id,n])=>`<button class="filter ${f===id?'on':''}" data-f="${id}">${n}</button>`).join('');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('on',x.dataset.f===filter));draw()});draw()}
function draw(){svg.innerHTML='';let ns=names.filter(n=>filter==='all'||nodePeriod(n)===filter);let cols=6, gapX=220,gapY=125;let pos={};ns.forEach((n,i)=>{pos[n]={x:90+(i%cols)*gapX,y:100+Math.floor(i/cols)*gapY}});
let g=document.createElementNS(NS,'g');g.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`);svg.appendChild(g);
function edge(a,b,cls,label){if(!pos[a]||!pos[b])return;let l=document.createElementNS(NS,'line');l.setAttribute('x1',pos[a].x);l.setAttribute('y1',pos[a].y);l.setAttribute('x2',pos[b].x);l.setAttribute('y2',pos[b].y);l.setAttribute('class','edge '+cls);g.appendChild(l);if(label){let t=document.createElementNS(NS,'text');t.setAttribute('x',(pos[a].x+pos[b].x)/2);t.setAttribute('y',(pos[a].y+pos[b].y)/2-5);t.setAttribute('class','edgeLabel '+cls);t.textContent=label;g.appendChild(t)}}
ns.forEach(n=>{(D[n].links||[]).forEach(x=>edge(n,x,'',''));(D[n].lineage||[]).forEach((x,i)=>{if(i>0)edge(D[n].lineage[i-1],x,'lineage','変遷')});(D[n].why?[]:[])});

ns.forEach((n,i)=>{let p=pos[n],q=document.createElementNS(NS,'g');q.setAttribute('class','node');q.dataset.n=n;let c=document.createElementNS(NS,'circle');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',Math.max(28,Math.min(42,20+n.length*2)));q.appendChild(c);let t=document.createElementNS(NS,'text');t.setAttribute('x',p.x);t.setAttribute('y',p.y+4);t.textContent=n;q.appendChild(t);let m=document.createElementNS(NS,'text');m.setAttribute('x',p.x);m.setAttribute('y',p.y+18);m.setAttribute('class','metaText');m.textContent=D[n].year||'';q.appendChild(m);q.onclick=()=>showInfo(n);g.appendChild(q)});
}
function showInfo(n){selected=n;let d=D[n],links=(d.links||[]).filter(x=>D[x]);let lin=(d.lineage||[]);document.getElementById('info').style.display='block';document.getElementById('info').innerHTML=`<b style="font-size:20px">${n}</b><div class="meta"><span class="year">${d.year||'年代不詳'}</span>　${d.era||''}　｜ ${d.type}</div><div>${d.desc||''}</div>${d.why?`<div class="reason"><b>なぜ起きた？</b><br>${d.why}</div>`:''}${lin.length>1?`<div class="reason" style="border-color:#a78bfa"><b>変遷</b><br>${lin.map((x,i)=>`${i?' → ':''}${x}`).join('')}</div>`:''}<div class="meta">関連事項</div><div class="chips">${links.map(x=>`<button class="chip ${D[x].why?'cause':''}" data-n="${x}">${x}</button>`).join('')}</div>`;document.querySelectorAll('#info .chip').forEach(b=>b.onclick=()=>showInfo(b.dataset.n))}
document.getElementById('q').oninput=e=>{let v=e.target.value.trim().toLowerCase();let r=document.getElementById('results');if(!v){r.style.display='none';return}let hit=names.filter(n=>(n+D[n].year+D[n].desc).toLowerCase().includes(v)).slice(0,20);r.innerHTML=hit.map(n=>`<button class="result" data-n="${n}"><span>${n}</span><small>${D[n].year||''}</small></button>`).join('');r.style.display='block';r.querySelectorAll('.result').forEach(b=>b.onclick=()=>{r.style.display='none';e.target.value=b.dataset.n;showInfo(b.dataset.n)})};

let app=document.getElementById('app');app.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,tx,ty};app.setPointerCapture(e.pointerId)});app.addEventListener('pointermove',e=>{if(!drag)return;tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;draw()});app.addEventListener('pointerup',()=>drag=null);app.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.5,Math.min(2.5,scale*(e.deltaY<0?1.1:.9)));draw()},{passive:false});
