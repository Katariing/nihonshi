<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>日本史 Knowledge Map</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050912}
#map{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<iframe id="map" src="app.html" title="日本史 Knowledge Map"></iframe>
<script>
const frame=document.getElementById('map');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  const oldApp=d.getElementById('app');
  const svg=d.getElementById('svg');
  if(!oldApp||!svg)return;
  const fixApp=d.createElement('div');
  fixApp.id='app';
  fixApp.style.touchAction='none';
  oldApp.parentNode.replaceChild(fixApp,oldApp);
  fixApp.appendChild(svg);
  frame.contentWindow.eval("(function(){\n"+
  "const state={pointers:new Map(),pan:null,pinch:null,moved:false,raf:0};\n"+
  "function schedule(){if(state.raf)return;state.raf=requestAnimationFrame(()=>{state.raf=0;render()})}\n"+
  "function svgPoint(x,y){const r=svg.getBoundingClientRect();return{x:(x-r.left)*1400/r.width,y:(y-r.top)*900/r.height}}\n"+
  "function midpoint(){const a=[...state.pointers.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}\n"+
  "function distance(){const a=[...state.pointers.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}\n"+
  "fixApp.addEventListener('pointerdown',e=>{state.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});try{fixApp.setPointerCapture(e.pointerId)}catch(_){}if(state.pointers.size===2){const mid=midpoint(),p=svgPoint(mid.x,mid.y);state.pinch={dist:Math.max(1,distance()),scale:view.s,focusX:(p.x-view.x)/view.s,focusY:(p.y-view.y)/view.s};state.pan=null;state.moved=true;return}if(e.target.closest&&e.target.closest('.node')){state.pan=null;state.moved=false;return}state.pan={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};state.moved=false});\n"+
  "fixApp.addEventListener('pointermove',e=>{if(!state.pointers.has(e.pointerId))return;state.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(state.pointers.size===2&&state.pinch){const mid=midpoint(),r=svg.getBoundingClientRect(),next=Math.max(.45,Math.min(2.8,state.pinch.scale*distance()/state.pinch.dist)),mx=(mid.x-r.left)*1400/r.width,my=(mid.y-r.top)*900/r.height;view.s=next;view.x=mx-state.pinch.focusX*next;view.y=my-state.pinch.focusY*next;state.moved=true;schedule();e.preventDefault();return}if(state.pan){const r=svg.getBoundingClientRect(),dx=(e.clientX-state.pan.x)*1400/r.width,dy=(e.clientY-state.pan.y)*900/r.height;if(Math.abs(e.clientX-state.pan.x)+Math.abs(e.clientY-state.pan.y)>4)state.moved=true;view.x=state.pan.vx+dx;view.y=state.pan.vy+dy;schedule();e.preventDefault()}},{passive:false});\n"+
  "function end(e){state.pointers.delete(e.pointerId);if(state.pointers.size<2)state.pinch=null;if(state.pointers.size===0)state.pan=null}fixApp.addEventListener('pointerup',end);fixApp.addEventListener('pointercancel',end);fixApp.addEventListener('lostpointercapture',e=>state.pointers.delete(e.pointerId));\n"+
  "svg.addEventListener('click',e=>{const node=e.target.closest&&e.target.closest('.node');if(!node||state.moved)return;const name=node.querySelector('text')?.textContent?.trim();if(name&&DATA[name])select(name,true)});\n"+
  "fixApp.addEventListener('wheel',e=>{e.preventDefault();const old=view.s,next=Math.max(.45,Math.min(2.8,old*(e.deltaY<0?1.1:.9))),p=svgPoint(e.clientX,e.clientY);view.x=p.x-(p.x-view.x)*(next/old);view.y=p.y-(p.y-view.y)*(next/old);view.s=next;schedule()},{passive:false});render();})()" );
});
</script>
</body>
</html>
